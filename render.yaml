services:
  - type: web
    name: xhs-cover-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm run server:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLATO_BASE_URL
        sync: false
      - key: PLATO_API_KEY
        sync: false
      - key: PLATO_AUTH_MODE
        value: x-api-key
      - key: PLATO_MODEL_IMAGE2
        value: gpt-image-2-all
      - key: PLATO_GENERATIONS_PATH
        value: /v1/images/generations
      - key: PLATO_TASKS_PATH_PREFIX
        value: /v1/images/tasks
      - key: PLATO_ASYNC
        value: "false"
      - key: PLATO_MODEL_SLICER
        value: gemini-3-pro-preview
      - key: AUTH_JWT_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: APP_DATA_DIR
        value: ./api/data
